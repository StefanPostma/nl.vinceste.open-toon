# Keeps the development tooling (the Homey CLI, ESLint, the SDK types) and the actions of the workflows current.
# The app itself has no runtime dependencies, so no pull request ever touches what is shipped.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
