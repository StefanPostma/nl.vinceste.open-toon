<style>
  [hidden] {
    display: none !important;
  }
  .pair-hint {
    margin-block: 0.5em 0;
    font-size: 0.875em;
    opacity: 0.75;
  }
  .pair-error {
    color: var(--homey-color-danger, #d93025);
    font-weight: 600;
  }
  .pair-ok {
    font-weight: 600;
  }
  .pair-readings {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.25em 1em;
    margin-block: 0.5em 1em;
  }
  .pair-readings dt {
    opacity: 0.75;
  }
  .pair-readings dd {
    margin: 0;
    font-weight: 600;
  }
  .pair-actions {
    display: grid;
    gap: 0.75em;
    margin-block-start: 1em;
  }
</style>

<p class="homey-subtitle" data-i18n="pair.intro"></p>

<div class="homey-form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="address" data-i18n="pair.address"></label>
    <input class="homey-form-input" id="address" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.50">
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="toon-id" data-i18n="pair.id"></label>
    <input class="homey-form-input" id="toon-id" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="pair-hint" data-i18n="pair.id_hint"></p>
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="name" data-i18n="pair.name"></label>
    <input class="homey-form-input" id="name" type="text" autocomplete="off">
    <p class="pair-hint" data-i18n="pair.name_hint"></p>
  </div>

  <p class="pair-error" id="error" role="alert" hidden></p>

  <div id="result" hidden>
    <p class="pair-ok" data-i18n="pair.test_ok"></p>
    <dl class="pair-readings">
      <dt data-i18n="pair.reading_temperature"></dt>
      <dd id="reading-temperature"></dd>
      <dt data-i18n="pair.reading_setpoint"></dt>
      <dd id="reading-setpoint"></dd>
      <dt data-i18n="pair.reading_program"></dt>
      <dd id="reading-program"></dd>
      <dt data-i18n="pair.reading_state"></dt>
      <dd id="reading-state"></dd>
    </dl>
  </div>

  <div class="homey-form-group" id="toonwater-offer" hidden>
    <p class="pair-hint" data-i18n="pair.toonwater_detected"></p>
    <label class="homey-form-checkbox">
      <input class="homey-form-checkbox-input" id="toonwater" type="checkbox">
      <span class="homey-form-checkbox-checkmark"></span>
      <span class="homey-form-checkbox-text" data-i18n="pair.toonwater_label"></span>
    </label>
  </div>

  <div class="pair-actions">
    <button class="homey-button-primary-shadow-full" id="test" type="button" data-i18n="pair.test"></button>
    <button class="homey-button-primary-full" id="connect" type="button" disabled data-i18n="pair.connect"></button>
  </div>
</div>

<script type="application/javascript">
  (function () {
    'use strict';

    // The words of the answers of the app; the table keys are the values the handler of the app sends.
    const PROGRAM_TEXT = { on: 'pair.program_on', off: 'pair.program_off' };
    const STATE_TEXT = {
      comfort: 'pair.state_comfort',
      home: 'pair.state_home',
      sleep: 'pair.state_sleep',
      away: 'pair.state_away',
      vacation: 'pair.state_vacation',
      none: 'pair.state_none',
    };

    const byId = (id) => document.getElementById(id);
    const input = { address: byId('address'), id: byId('toon-id'), name: byId('name') };
    const error = byId('error');
    const result = byId('result');
    const reading = {
      temperature: byId('reading-temperature'),
      setpoint: byId('reading-setpoint'),
      program: byId('reading-program'),
      state: byId('reading-state'),
    };
    const offer = byId('toonwater-offer');
    const toonwater = byId('toonwater');
    const testButton = byId('test');
    const connectButton = byId('connect');

    let tested = null; // the address that the last successful test reached; the device is added at this address
    let busy = false;

    function setButtons() {
      testButton.disabled = busy;
      connectButton.disabled = busy || tested === null;
      testButton.classList.toggle('is-disabled', testButton.disabled);
      connectButton.classList.toggle('is-disabled', connectButton.disabled);
    }

    function setBusy(value, button) {
      busy = value;
      button.classList.toggle('is-loading', value);
      setButtons();
    }

    function showError(message) {
      error.textContent = message;
      error.hidden = false;
    }

    function clearError() {
      error.textContent = '';
      error.hidden = true;
    }

    // What the app answers with is a sentence in the language of the user; a rejection without one gets the general sentence.
    function messageOf(problem) {
      return problem && typeof problem.message === 'string' && problem.message !== '' ? problem.message : Homey.__('error.unknown');
    }

    function word(table, key) {
      return typeof key === 'string' && Object.prototype.hasOwnProperty.call(table, key) ? Homey.__(table[key]) : '-';
    }

    function degrees(value) {
      return typeof value === 'number' && Number.isFinite(value)
        ? value.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' °C'
        : '-';
    }

    // Everything the Toon reported is written as text, never as markup.
    function showReadings(readings) {
      reading.temperature.textContent = degrees(readings.currentTemp);
      reading.setpoint.textContent = degrees(readings.currentSetpoint);
      reading.program.textContent = word(PROGRAM_TEXT, readings.programState);
      reading.state.textContent = word(STATE_TEXT, readings.activeState);
      result.hidden = false;
    }

    // A test that is out of date: Connect is off again until the next test has succeeded.
    function forgetTest() {
      tested = null;
      result.hidden = true;
      offer.hidden = true;
      toonwater.checked = false;
      setButtons();
    }

    function acceptTest(answer) {
      if (!answer || typeof answer.host !== 'string' || !answer.readings || typeof answer.readings !== 'object') {
        throw new Error(Homey.__('error.unknown'));
      }
      tested = answer.host;
      input.address.value = answer.host;
      showReadings(answer.readings);
      offer.hidden = !(answer.features && answer.features.toonwater === 'detected');
    }

    // An address that was edited while its test ran has nothing to do with the answer: the user tests again.
    async function runTest() {
      if (busy) return;
      forgetTest();
      clearError();
      setBusy(true, testButton);
      const requested = input.address.value;
      try {
        const answer = await Homey.emit('testConnection', { address: requested });
        if (input.address.value === requested) acceptTest(answer);
      } catch (problem) {
        if (input.address.value === requested) showError(messageOf(problem));
      } finally {
        setBusy(false, testButton);
      }
    }

    async function runConnect() {
      if (busy || tested === null) return;
      clearError();
      setBusy(true, connectButton);
      try {
        let device;
        try {
          device = await Homey.emit('buildDevice', {
            name: input.name.value,
            id: input.id.value,
            address: tested,
            features: { toonwater: !offer.hidden && toonwater.checked },
          });
        } catch (problem) {
          showError(messageOf(problem));
          return;
        }
        try {
          await Homey.createDevice(device);
        } catch (problem) {
          showError(Homey.__('pair.create_failed', { error: messageOf(problem) }));
          return;
        }
        Homey.done();
      } finally {
        setBusy(false, connectButton);
      }
    }

    input.address.addEventListener('input', forgetTest);
    [input.address, input.id, input.name].forEach((element) => element.addEventListener('input', clearError));
    testButton.addEventListener('click', runTest);
    connectButton.addEventListener('click', runConnect);

    Homey.setTitle(Homey.__('pair.title'));
    setButtons();
  }());
</script>
